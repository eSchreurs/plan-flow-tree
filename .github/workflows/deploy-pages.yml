# Deploys the app to GitHub Pages (https://<owner>.github.io/plan-flow-tree/)
# on every push to main, or manually from the Actions tab.
#
# One-time setup: repo Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions". The workflow also tries to enable Pages by itself,
# but GitHub's API often refuses that for the workflow token ("Resource not
# accessible by integration") — the Settings toggle always works.
# Note: on a free GitHub plan, Pages requires the repository to be public.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Enable GitHub Pages (best effort)
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" --silent; then
            echo "::error::GitHub Pages could not be enabled automatically. One-time fix: Settings → Pages → 'Build and deployment' → Source: 'GitHub Actions', then re-run this workflow. (On a free plan the repository must be public.)"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
